[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "knuckles-cli"
version = "0.1.0"
description = "Operator CLI for the Knuckles identity service"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Garrett Sooter", email = "garrett.sooter@gmail.com" },
]
keywords = ["authentication", "identity", "cli", "knuckles", "oauth", "passkey"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.31,<3",
    "cryptography>=42.0,<46",
]

[project.scripts]
knuckles = "knuckles_cli.cli:main"

[project.urls]
Homepage = "https://github.com/gsooter/knuckles"
Documentation = "https://gsooter.github.io/knuckles/cli"
Source = "https://github.com/gsooter/knuckles/tree/main/packages/knuckles-cli"
Issues = "https://github.com/gsooter/knuckles/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "responses>=0.25,<1",
    "mypy>=1.9,<2",
    "ruff==0.15.11",
    "black>=24.0,<25",
    "types-requests>=2.31,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
knuckles_cli = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "TCH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["TC001", "TC002", "TC003"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["knuckles_cli"]

[tool.coverage.report]
fail_under = 80
show_missing = true
